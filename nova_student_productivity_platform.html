<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOVA — Your Focus. Your Future.</title>

  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
          },
          colors: {
            nova: {
              bg: '#040712',
              navy: '#091026',
              card: 'rgba(13, 21, 48, 0.72)',
              blue: '#3B82F6',
              cyan: '#38BDF8',
              purple: '#8B5CF6',
            }
          }
        }
      }
    };
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-deep: #040712;
      --bg-navy: #091026;
      --card-bg: rgba(13, 22, 50, 0.72);
      --card-border: rgba(59, 130, 246, 0.24);
      --card-border-hover: rgba(56, 189, 248, 0.55);
      --accent-blue: #3B82F6;
      --accent-cyan: #38BDF8;
      --accent-purple: #8B5CF6;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-deep);
      color: #F8FAFC;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Deep space futuristic cosmic backdrop */
    .nova-backdrop {
      background:
        radial-gradient(circle at 12% 10%, rgba(59, 130, 246, 0.16) 0%, transparent 38%),
        radial-gradient(circle at 86% 14%, rgba(139, 92, 246, 0.15) 0%, transparent 36%),
        radial-gradient(circle at 52% 88%, rgba(37, 99, 235, 0.12) 0%, transparent 45%),
        linear-gradient(160deg, #040712 0%, #070D1F 50%, #050918 100%);
    }

    /* Glassmorphism Cards */
    .glass-card {
      background: linear-gradient(145deg, rgba(16, 27, 62, 0.76) 0%, rgba(10, 16, 38, 0.84) 100%);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--card-border);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      transition: border-color 0.25s ease, transform 0.22s ease, box-shadow 0.25s ease;
    }

    .glass-card:hover {
      border-color: rgba(59, 130, 246, 0.42);
      box-shadow:
        0 12px 36px rgba(0, 0, 0, 0.55),
        0 0 22px rgba(59, 130, 246, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.09);
    }

    .glass-card-ai {
      background: linear-gradient(145deg, rgba(25, 42, 102, 0.82) 0%, rgba(28, 22, 76, 0.86) 100%);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(99, 102, 241, 0.42);
      box-shadow:
        0 10px 36px rgba(37, 99, 235, 0.2),
        inset 0 1px 0 rgba(147, 197, 253, 0.18);
    }

    .glass-subcard {
      background: rgba(15, 25, 58, 0.65);
      border: 1px solid rgba(59, 130, 246, 0.22);
      transition: all 0.22s ease;
    }

    .glass-subcard:hover {
      background: rgba(22, 36, 82, 0.8);
      border-color: rgba(56, 189, 248, 0.48);
      transform: translateY(-2px);
    }

    /* Sidebar Active Pill */
    .nav-item {
      transition: all 0.2s ease;
    }

    .nav-item.active {
      background: linear-gradient(90deg, rgba(37, 99, 235, 0.85) 0%, rgba(56, 189, 248, 0.35) 100%);
      border: 1px solid rgba(96, 165, 250, 0.5);
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.35);
      color: #FFFFFF;
    }

    .nav-item:not(.active):hover {
      background: rgba(59, 130, 246, 0.12);
      color: #E2E8F0;
    }

    /* Animated Progress Bars */
    .progress-fill {
      background: linear-gradient(90deg, #2563EB 0%, #38BDF8 100%);
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.5);
      transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Flame pulse animation */
    @keyframes flameFlicker {
      0%, 100% { transform: scale(1) rotate(-2deg); filter: drop-shadow(0 0 6px rgba(251, 146, 60, 0.8)); }
      50% { transform: scale(1.1) rotate(3deg); filter: drop-shadow(0 0 12px rgba(249, 115, 22, 0.95)); }
    }
    .flame-anim {
      display: inline-block;
      animation: flameFlicker 2.2s ease-in-out infinite;
    }

    /* Subtle float for AI robot */
    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    .float-anim {
      animation: gentleFloat 3.4s ease-in-out infinite;
    }

    /* Page transition */
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .page-enter {
      animation: fadeSlideIn 0.28s ease-out forwards;
    }

    /* Confetti burst */
    @keyframes confettiPop {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-60px) scale(0.4); opacity: 0; }
    }
    .confetti-piece {
      position: fixed;
      width: 8px;
      height: 8px;
      border-radius: 2px;
      pointer-events: none;
      z-index: 9999;
      animation: confettiPop 0.9s ease-out forwards;
    }

    /* Bar chart glowing bars */
    .study-bar {
      background: linear-gradient(180deg, #38BDF8 0%, #2563EB 65%, rgba(30, 58, 138, 0.45) 100%);
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.35);
      transition: height 0.6s cubic-bezier(0.22, 1, 0.36, 1), filter 0.2s ease;
    }
    .study-bar:hover {
      filter: brightness(1.22);
      box-shadow: 0 0 22px rgba(56, 189, 248, 0.65);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(6, 11, 28, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(59, 130, 246, 0.35);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(56, 189, 248, 0.6);
    }

    /* Skeleton shimmer */
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, rgba(30,41,82,0.4) 25%, rgba(59,130,246,0.18) 50%, rgba(30,41,82,0.4) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }

    /* Typing dots */
    @keyframes blinkDot {
      0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
      40% { opacity: 1; transform: scale(1.1); }
    }
    .typing-dot {
      animation: blinkDot 1.3s infinite ease-in-out both;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  </style>
</head>

    async function saveUserStateToCloud() {
      if (!firebaseReady || !fbDb || !currentUser) return;
      try {
        const userDocRef = doc(fbDb, 'artifacts', appId, 'users', currentUser.uid, 'profile', 'nova_state');
        // Serialize safely without nested arrays or transient UI flags
        const payload = {
          serializedState: JSON.stringify({
            profile: state.profile,
            streak: state.streak,
            deadlines: state.deadlines,
            challenges: state.challenges,
            tasks: state.tasks,
            partners: state.partners,
            friendRequests: state.friendRequests,
            studyRooms: state.studyRooms,
            runningNotes: state.runningNotes,
            projects: state.projects,
            learnSaved: state.learn.savedVideos,
            learnPlaylist: state.learn.playlistVideos,
            learnCompleted: state.learn.completedVideos,
            focusSessions: state.focus.sessionsCompleted,
            focusHistory: state.focus.history
          }),
          updatedAt: Date.now()
        };
        await setDoc(userDocRef, payload, { merge: true });
      } catch (err) {
        console.warn("Cloud sync paused:", err.message);
      }
    }

    async function loadUserStateFromCloud(uid) {
      if (!firebaseReady || !fbDb || !uid) return;
      try {
        const userDocRef = doc(fbDb, 'artifacts', appId, 'users', uid, 'profile', 'nova_state');
        const snap = await getDoc(userDocRef);
        if (snap.exists() && snap.data()?.serializedState) {
          const parsed = JSON.parse(snap.data().serializedState);
          if (parsed.profile) state.profile = { ...state.profile, ...parsed.profile };
          if (parsed.streak) state.streak = parsed.streak;
          if (parsed.deadlines) state.deadlines = parsed.deadlines;
          if (parsed.challenges) state.challenges = parsed.challenges;
          if (parsed.tasks) state.tasks = parsed.tasks;
          if (parsed.partners) state.partners = parsed.partners;
          if (parsed.friendRequests) state.friendRequests = parsed.friendRequests;
          if (parsed.studyRooms) state.studyRooms = parsed.studyRooms;
          if (parsed.runningNotes) state.runningNotes = parsed.runningNotes;
          if (parsed.projects) state.projects = parsed.projects;
          if (parsed.learnSaved) state.learn.savedVideos = parsed.learnSaved;
          if (parsed.learnPlaylist) state.learn.playlistVideos = parsed.learnPlaylist;
          if (parsed.learnCompleted) state.learn.completedVideos = parsed.learnCompleted;
          if (typeof parsed.focusSessions === 'number') state.focus.sessionsCompleted = parsed.focusSessions;
          if (parsed.focusHistory) state.focus.history = parsed.focusHistory;

        console.warn("Could not load cloud state, using default sample data:", err.message);
      }
    }

    async function initAuth() {
      if (!firebaseReady || !fbAuth) {
        updateHeaderUI();
        return;
      }
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(fbAuth, __initial_auth_token);
        } else {
          await signInAnonymously(fbAuth);
        }
      } catch (err) {
        console.warn("Initial auth fallback to demo:", err.message);
      }

      onAuthStateChanged(fbAuth, async (user) => {
        currentUser = user;
        if (user && !user.isAnonymous) {
          isDemoMode = false;
          if (user.email) state.profile.email = user.email;
          await loadUserStateFromCloud(user.uid);
        } else if (user && user.isAnonymous) {
          isDemoMode = true;
          await loadUserStateFromCloud(user.uid);
        } else {
          isDemoMode = true;
        }
        updateHeaderUI();
      });
    }

    // 5. GEMINI API HELPER (With Exponential Backoff)
    // =========================================================================
    async function callGeminiAPI(userPrompt, systemPrompt = '', jsonSchema = null) {
      const apiKey = "";
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

      const payload = {
        contents: [{ parts: [{ text: userPrompt }] }],
        ...(systemPrompt ? { systemInstruction: { parts: [{ text: systemPrompt }] } } : {}),
        ...(jsonSchema ? {
          generationConfig: {
            responseMimeType: "application/json",
            responseSchema: jsonSchema
          }
        } : {})
      };

      const delays = [1000, 2000, 4000];
      for (let attempt = 0; attempt <= delays.length; attempt++) {
        try {
          const res = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
          if (text) return text;
          throw new Error('Empty AI response');
        } catch (err) {
          if (attempt < delays.length) {
            await new Promise(r => setTimeout(r, delays[attempt]));
          } else {
            throw err;
          }
        }
      }
    }

    window.showToast = function (message, type = 'info') {
      const stack = document.getElementById('toast-stack');
      const id = 'toast-' + Date.now() + Math.random().toString(36).slice(2, 5);
      const colors = {
        info: 'border-blue-400/40 bg-[#0B1536]/95 text-sky-100',
        success: 'border-emerald-400/45 bg-[#071F26]/95 text-emerald-100',
        warning: 'border-amber-400/45 bg-[#241A0B]/95 text-amber-100',
        error: 'border-rose-400/45 bg-[#2A0E19]/95 text-rose-100'
      };
      const icons = {
        info: 'sparkles',
        success: 'check-circle-2',
        warning: 'alert-triangle',
        error: 'x-circle'
      };

      const el = document.createElement('div');
      el.id = id;
      el.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-2xl border backdrop-blur-xl shadow-2xl text-sm font-medium transition-all duration-300 translate-y-2 opacity-0 ${colors[type] || colors.info}`;
      el.innerHTML = `
        <i data-lucide="${icons[type] || 'sparkles'}" class="w-4 h-4 shrink-0"></i>
        <span class="flex-1 leading-snug">${escapeHtml(message)}</span>
      `;
      stack.appendChild(el);
      lucide.createIcons({ nodes: [el] });
      requestAnimationFrame(() => {
        el.classList.remove('translate-y-2', 'opacity-0');
      });
      setTimeout(() => {
        el.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => el.remove(), 300);
      }, 3400);
    };

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatMarkdownSimple(text) {
      let safe = escapeHtml(text);
      safe = safe.replace(/\*\*(.+?)\*\*/g, '<strong class="text-white font-semibold">$1</strong>');
      safe = safe.replace(/`([^`]+)`/g, '<code class="px-1.5 py-0.5 rounded bg-blue-950/90 border border-blue-500/30 text-sky-300 text-xs font-mono">$1</code>');
      safe = safe.replace(/\n/g, '<br/>');
      return safe;
    }

    window.copyToClipboard = function (text, label = 'Copied') {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast(`${label}: ${text}`, 'success');
      } catch {
        showToast('Could not copy automatically.', 'warning');
      }
      document.body.removeChild(ta);
    };

    function triggerConfetti() {
      const colors = ['#38BDF8', '#3B82F6', '#8B5CF6', '#34D399', '#FBBF24'];
      for (let i = 0; i < 24; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.backgroundColor = colors[i % colors.length];
        piece.style.left = (35 + Math.random() * 30) + 'vw';
        piece.style.top = (35 + Math.random() * 20) + 'vh';
        piece.style.transform = `rotate(${Math.random() * 360}deg)`;
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 950);
      }
    }

    function getCountdownLabel(dateStr) {
      const now = new Date('2026-11-24T12:35:00');
      const target = new Date(dateStr + 'T10:00:00');
      const diffMs = target - now;
      const diffHrs = Math.round(diffMs / 36e5);
      if (diffHrs <= 0) return 'Due today';
      if (diffHrs < 24) return `${diffHrs}h left`;
      const days = Math.ceil(diffHrs / 24);
      return days === 1 ? 'Tomorrow' : `In ${days} days`;
    }

    function formatTimer(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = (sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    // 11. PAGE 4: NOVA LEARN — DISTRACTION-FREE YOUTUBE + RUNNING NOTES
    // =========================================================================
    function getFilteredVideos() {
      const source = state.learn.liveResults || CURATED_VIDEOS;
      const q = state.learn.searchQuery.trim().toLowerCase();
      return source.filter(v => {
        if (v.aiCategory === 'Unrelated') return false;
        const matchSub = state.learn.subjectFilter === 'All' || v.subject === state.learn.subjectFilter;
        const matchQuery = !q || v.title.toLowerCase().includes(q) || v.channel.toLowerCase().includes(q) || v.subject.toLowerCase().includes(q) || v.description.toLowerCase().includes(q);
        let matchDur = true;
        if (state.learn.durationFilter === 'short') matchDur = v.durationMins <= 15;
        else if (state.learn.durationFilter === 'medium') matchDur = v.durationMins > 15 && v.durationMins <= 45;
        else if (state.learn.durationFilter === 'long') matchDur = v.durationMins > 45;
        return matchSub && matchQuery && matchDur;
      }).sort((a, b) => {
        if (state.learn.sortBy === 'duration') return a.durationMins - b.durationMins;
        const rank = { 'Highly Relevant': 3, 'Educational': 2, 'Partially Relevant': 1 };
        return (rank[b.aiCategory] || 0) - (rank[a.aiCategory] || 0);
      });
    }

            <!-- Recent Searches & Filters Row -->
            <div class="flex flex-wrap items-center justify-between gap-3 pt-3 border-t border-blue-500/15 text-xs">
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="text-slate-400">Recent:</span>
                ${state.learn.recentSearches.slice(0, 4).map(rs => `

              <div class="flex items-center gap-2">

                  <option value="duration" ${state.learn.sortBy === 'duration' ? 'selected' : ''}>Sort: Shortest First</option>

          </section>

          <!-- Video Results Grid -->
          ${state.learn.isSearching ? `
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
              ${[1, 2, 3, 4, 5, 6].map(() => `
                <div class="glass-card rounded-2xl overflow-hidden p-4 space-y-3">
                  <div class="aspect-video rounded-xl skeleton"></div>
                  <div class="h-4 w-3/4 rounded skeleton"></div>
                  <div class="h-3 w-1/2 rounded skeleton"></div>

              `).join('')}
            </div>
          ` : videos.length ? `
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
              ${videos.map(v => {

    // =========================================================================
    // 12. PAGE 5: STUDY PLANNER (Full Calendar + Tasks + Saved Lecture Notes)
    // =========================================================================
    function renderPlannerHTML() {
      const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      const firstDay = new Date(state.calendarYear, state.calendarMonth, 1).getDay();
      const daysInMonth = new Date(state.calendarYear, state.calendarMonth + 1, 0).getDate();
      const selectedTasks = state.tasks.filter(t => t.date === state.selectedDate);

      let calendarCells = '';
      for (let i = 0; i < firstDay; i++) {
        calendarCells += `<div class="h-12 sm:h-14 rounded-xl bg-slate-950/30"></div>`;
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const iso = `${state.calendarYear}-${String(state.calendarMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const count = state.tasks.filter(t => t.date === iso).length;
        const isSel = state.selectedDate === iso;
        calendarCells += `
          <button onclick="selectPlannerDate('${iso}')" class="h-12 sm:h-14 rounded-xl border flex flex-col items-center justify-center transition ${isSel ? 'bg-blue-600 border-sky-300 text-white shadow-[0_0_14px_rgba(59,130,246,0.5)]' : 'bg-slate-900/60 border-blue-500/15 hover:border-sky-400/40 text-slate-200'}">
            <span class="text-xs sm:text-sm font-bold">${d}</span>
            ${count > 0 ? `<span class="text-[10px] ${isSel ? 'text-sky-100' : 'text-sky-400'}">${count} task${count > 1 ? 's' : ''}</span>` : ''}
          </button>
        `;
      }

      return `
        <div class="space-y-5">
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div>
              <h2 class="font-display font-bold text-2xl text-white">Study Planner &amp; Notes</h2>
              <p class="text-sm text-slate-400">Organize daily schedules, deadlines, and saved lecture running notes</p>
            </div>
            <div class="flex items-center gap-2 bg-slate-950/70 p-1.5 rounded-xl border border-blue-500/20">
              <button onclick="setPlannerTab('calendar')" class="px-4 py-1.5 rounded-lg text-xs font-semibold transition ${state.plannerTab === 'calendar' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'}">Calendar &amp; Tasks</button>
              <button onclick="setPlannerTab('notes')" class="px-4 py-1.5 rounded-lg text-xs font-semibold transition ${state.plannerTab === 'notes' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:text-white'}">Saved Lecture Notes (${state.runningNotes.length})</button>
            </div>
          </div>

          ${state.plannerTab === 'calendar' ? `
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
              <!-- Monthly Calendar -->
              <section class="lg:col-span-7 glass-card rounded-2xl p-5">
                <div class="flex items-center justify-between mb-4">
                  <button onclick="shiftCalendarMonth(-1)" class="p-2 rounded-lg bg-slate-900/70 hover:bg-blue-500/20 text-slate-300"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
                  <h3 class="font-display font-bold text-base text-white">${monthNames[state.calendarMonth]} ${state.calendarYear}</h3>
                  <button onclick="shiftCalendarMonth(1)" class="p-2 rounded-lg bg-slate-900/70 hover:bg-blue-500/20 text-slate-300"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
                </div>
                <div class="grid grid-cols-7 gap-2 text-center text-[11px] font-semibold text-slate-400 mb-2">
                  <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
                </div>
                <div class="grid grid-cols-7 gap-2">${calendarCells}</div>
              </section>

              <!-- Day Task Manager -->
              <section class="lg:col-span-5 glass-card rounded-2xl p-5 flex flex-col justify-between gap-4">
                <div>
                  <div class="flex items-center justify-between mb-4">
                    <div>
                      <h3 class="font-display font-bold text-base text-white">Tasks for ${state.selectedDate}</h3>
                      <p class="text-xs text-slate-400">${selectedTasks.length} scheduled item(s)</p>
                    </div>
                    <button onclick="openTaskModal()" class="px-3 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold inline-flex items-center gap-1">
                      <i data-lucide="plus" class="w-3.5 h-3.5"></i> New Task
                    </button>
                  </div>
                  <div class="space-y-2.5 max-h-80 overflow-y-auto pr-1">
                    ${selectedTasks.length ? selectedTasks.map(t => `
                      <div class="p-3 rounded-xl bg-slate-900/65 border border-blue-500/20 flex items-center justify-between gap-2">
                        <label class="flex items-start gap-2.5 cursor-pointer flex-1 min-w-0">
                          <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask('${t.id}')" class="mt-0.5 w-4 h-4 accent-blue-500 rounded" />
                          <div class="min-w-0">
                            <p class="text-sm font-medium truncate ${t.done ? 'line-through text-slate-500' : 'text-white'}">${escapeHtml(t.title)}</p>
                            <p class="text-[11px] text-slate-400">${escapeHtml(t.subject)} • ${t.priority} Priority ${t.reminder ? '• 🔔 Reminder' : ''}</p>
                          </div>
                        </label>
                        <button onclick="deleteTask('${t.id}')" class="p-1.5 rounded-lg hover:bg-rose-500/20 text-slate-400 hover:text-rose-300">
                          <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                        </button>
                      </div>
                    `).join('') : `<p class="text-center py-10 text-xs text-slate-400">No tasks on this date yet.</p>`}
                  </div>
                </div>
              </section>
            </div>
          ` : `
            <!-- Saved Lecture Running Notes Library -->
            <section class="glass-card rounded-2xl p-6 space-y-4">
              <div class="flex flex-wrap items-center justify-between gap-3">
                <h3 class="font-display font-bold text-lg text-white">Saved Lecture Notes Library</h3>
                <button onclick="toggleNotesDrawer(true)" class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold inline-flex items-center gap-1.5">
                  <i data-lucide="plus" class="w-4 h-4"></i> New Running Note

    // =========================================================================
    // 16. INTERACTIVE ACTIONS & MODALS
    // =========================================================================
    function openModal(html) {
      const root = document.getElementById('modal-root');
      const box = document.getElementById('modal-box');
      box.innerHTML = html;
      root.classList.remove('hidden');
      root.classList.add('flex');
      lucide.createIcons({ nodes: [box] });
    }

    window.closeModal = function () {
      const root = document.getElementById('modal-root');
      root.classList.add('hidden');
      root.classList.remove('flex');
    };

    // --- Auth Modal (Login / Sign Up / Demo Mode) ---
    window.openAuthModal = function () {
      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="font-display font-bold text-lg text-white">NOVA Student Account</h3>
            <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>
          <p class="text-xs text-slate-400">Sign in or create a student account to sync your tasks, notes, and streaks to the cloud.</p>
          <div class="grid grid-cols-2 gap-2 bg-slate-950/70 p-1 rounded-xl border border-blue-500/20">
            <button id="auth-tab-login" onclick="switchAuthTab('login')" class="py-1.5 rounded-lg text-xs font-semibold bg-blue-600 text-white">Login</button>
            <button id="auth-tab-signup" onclick="switchAuthTab('signup')" class="py-1.5 rounded-lg text-xs font-semibold text-slate-400">Sign Up</button>
          </div>
          <form id="auth-form" onsubmit="submitAuthForm(event)" data-mode="login" class="space-y-3">
            <div id="auth-name-wrap" class="hidden">
              <label class="block text-xs text-slate-400 mb-1">Full Name</label>
              <input id="auth-name" type="text" placeholder="Alex Mercer" class="w-full bg-slate-950/80 border border-blue-500/25 rounded-xl px-3.5 py-2.5 text-sm text-white" />
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Student Email</label>
              <input id="auth-email" type="email" required placeholder="student@university.edu" class="w-full bg-slate-950/80 border border-blue-500/25 rounded-xl px-3.5 py-2.5 text-sm text-white" />
            </div>
            <div>
              <label class="block text-xs text-slate-400 mb-1">Password</label>
              <input id="auth-pass" type="password" required minlength="6" placeholder="••••••••" class="w-full bg-slate-950/80 border border-blue-500/25 rounded-xl px-3.5 py-2.5 text-sm text-white" />
            </div>
            <button type="submit" id="auth-submit-btn" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white text-sm font-semibold shadow-lg transition">Sign In</button>
          </form>
          <div class="relative text-center my-2">
            <span class="text-[11px] text-slate-500 bg-[#0D1632] px-2 relative z-10">or</span>
            <div class="absolute inset-x-0 top-1/2 h-px bg-blue-500/20"></div>
          </div>
          <button onclick="continueDemoMode()" class="w-full py-2.5 rounded-xl bg-white/5 hover:bg-white/10 border border-blue-400/30 text-sky-300 text-xs font-semibold transition">
            Continue in Demo Mode (Instant Access)
          </button>
        </div>
      `);
    };

    window.switchAuthTab = function (mode) {
      const form = document.getElementById('auth-form');
      form.dataset.mode = mode;
      document.getElementById('auth-name-wrap').classList.toggle('hidden', mode === 'login');
      document.getElementById('auth-submit-btn').textContent = mode === 'login' ? 'Sign In' : 'Create Student Account';
      document.getElementById('auth-tab-login').className = mode === 'login' ? 'py-1.5 rounded-lg text-xs font-semibold bg-blue-600 text-white' : 'py-1.5 rounded-lg text-xs font-semibold text-slate-400';
      document.getElementById('auth-tab-signup').className = mode === 'signup' ? 'py-1.5 rounded-lg text-xs font-semibold bg-blue-600 text-white' : 'py-1.5 rounded-lg text-xs font-semibold text-slate-400';
    };

    window.submitAuthForm = async function (e) {
      e.preventDefault();
      const mode = e.target.dataset.mode;
      const email = document.getElementById('auth-email').value.trim();
      const pass = document.getElementById('auth-pass').value;
      const fullName = document.getElementById('auth-name').value.trim();

      if (firebaseReady && fbAuth) {
        try {
          if (mode === 'signup') {
            await createUserWithEmailAndPassword(fbAuth, email, pass);
            if (fullName) {
              state.profile.fullName = fullName;
              state.profile.name = fullName.split(' ')[0];
            }
          } else {
            await signInWithEmailAndPassword(fbAuth, email, pass);

              <select id="pr-stage" class="bg-slate-950/80 border border-blue-500/25 rounded-xl px-3 py-2 text-xs text-white">
                <option>Not Started</option><option selected>In Progress</option><option>Under Review</option><option>Completed</option>
              </select>
              <input id="pr-due" type="date" value="2026-12-05" class="bg-slate-950/80 border border-blue-500/25 rounded-xl px-3 py-2 text-xs text-white" />
            </div>
            <input id="pr-milestone" placeholder="First milestone (optional)" class="w-full bg-slate-950/80 border border-blue-500/25 rounded-xl px-3.5 py-2.5 text-sm text-white" />
            <button type="submit" class="w-full py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold">Create Project</button>
          </form>
        </div>
      `);
    };

    window.submitProjectModal = function (e) {
      e.preventDefault();
      const ms = document.getElementById('pr-milestone').value.trim();
      state.projects.unshift({
        id: 'proj-' + Date.now(),
        title: document.getElementById('pr-title').value.trim(),
        subject: document.getElementById('pr-subject').value.trim(),
        stage: document.getElementById('pr-stage').value,
        progress: 10,
        dueDate: document.getElementById('pr-due').value,
        milestones: ms ? [{ text: ms, done: false }] : [{ text: 'Initial research & outline', done: false }]
      });
      closeModal();
      saveUserStateToCloud();
      renderCurrentPage();
      showToast('Project added to tracker!', 'success');
    };

    window.updateProjectProgress = function (id, val) {
      const p = state.projects.find(x => x.id === id);
      if (!p) return;
      p.progress = Number(val);
      if (p.progress === 100) p.stage = 'Completed';
      saveUserStateToCloud();
      renderCurrentPage();
    };

    window.changeProjectStage = function (id, stage) {
      const p = state.projects.find(x => x.id === id);
      if (!p) return;
      p.stage = stage;
      if (stage === 'Completed') p.progress = 100;
      saveUserStateToCloud();
      renderCurrentPage();
    };

    window.toggleProjectMilestone = function (pid, idx) {
      const p = state.projects.find(x => x.id === pid);
      if (!p || !p.milestones[idx]) return;
      p.milestones[idx].done = !p.milestones[idx].done;
      const doneCount = p.milestones.filter(m => m.done).length;
      p.progress = Math.round((doneCount / p.milestones.length) * 100);
      saveUserStateToCloud();
      renderCurrentPage();
    };

    window.deleteProject = function (id) {
      state.projects = state.projects.filter(p => p.id !== id);
      saveUserStateToCloud();
      renderCurrentPage();
      showToast('Project removed.', 'info');
    };

    // --- NOVA LEARN Logic (YouTube API + Gemini Educational Classifier) ---
    window.handleLearnSearch = async function (e) {
      e.preventDefault();
      const input = document.getElementById('learn-search-input');
      const query = input.value.trim();
      state.learn.searchQuery = query;
      if (query && !state.learn.recentSearches.includes(query)) {
        state.learn.recentSearches.unshift(query);
      }

      // If user configured a YouTube Data API v3 Key in Settings, fetch live YouTube videos + AI classify!
      if (state.profile.youtubeApiKey && query) {
        state.learn.isSearching = true;
        renderCurrentPage();
        try {
          const ytUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&maxResults=9&q=${encodeURIComponent(query + ' lecture tutorial')}&key=${encodeURIComponent(state.profile.youtubeApiKey)}`;
          const res = await fetch(ytUrl);
          if (!res.ok) throw new Error('YouTube API error');
          const data = await res.json();
          const rawVideos = (data.items || []).map(item => ({
            id: item.id.videoId,
            title: item.snippet.title,
            channel: item.snippet.channelTitle,
            duration: 'Lecture',
            durationMins: 20,
            subject: state.learn.subjectFilter === 'All' ? 'General' : state.learn.subjectFilter,
            description: item.snippet.description || 'Educational video retrieved via YouTube Data API.',
            aiCategory: 'Educational',
            aiReason: 'Classified from video title, channel, and description metadata.'
          }));

          // Run Gemini AI Educational Filter on returned metadata
          try {
            const schema = {
              type: "ARRAY",
              items: {
                type: "OBJECT",
                properties: {
                  id: { type: "STRING" },
                  aiCategory: { type: "STRING" },
                  aiReason: { type: "STRING" }
                }
              }
            };
            const prompt = `Classify these YouTube videos for the student query "${query}" strictly based on their title, channel, and description metadata (do NOT claim to have watched the video). Set aiCategory to one of: "Highly Relevant", "Educational", "Partially Relevant", or "Unrelated" (filter out entertainment, gaming, vlogs, clickbait). Return JSON array.\nVideos: ${JSON.stringify(rawVideos.map(v => ({ id: v.id, title: v.title, channel: v.channel, desc: v.description.slice(0, 140) })))}`;
            const aiRaw = await callGeminiAPI(prompt, 'You are an educational content classifier.', schema);
            const classified = JSON.parse(aiRaw);
            rawVideos.forEach(v => {
              const found = classified.find(c => c.id === v.id);
              if (found) {
                v.aiCategory = found.aiCategory;
                v.aiReason = found.aiReason;
              }
            });
          } catch {}

          state.learn.liveResults = rawVideos;
          showToast(`Found & AI-filtered ${rawVideos.filter(v => v.aiCategory !== 'Unrelated').length} educational videos!`, 'success');
        } catch {
          state.learn.liveResults = null;
          showToast('Live YouTube API unavailable — showing curated educational Demo Library.', 'warning');
        } finally {
          state.learn.isSearching = false;
          renderCurrentPage();
        }
      } else {
        state.learn.liveResults = null;
        renderCurrentPage();
      }
    };

    window.quickLearnSearch = function (q) {
      state.learn.searchQuery = q;
      state.learn.subjectFilter = 'All';
      renderCurrentPage();
    };

    window.setLearnSubject = function (sub) {
      state.learn.subjectFilter = sub;
      renderCurrentPage();
    };

    window.setLearnDuration = function (dur) {
      state.learn.durationFilter = dur;
      renderCurrentPage();
    };

    window.setLearnSort = function (sort) {
      state.learn.sortBy = sort;
      renderCurrentPage();
    };

    window.resetLearnFilters = function () {
      state.learn.searchQuery = '';
      state.learn.subjectFilter = 'All';
      state.learn.durationFilter = 'All';
      state.learn.liveResults = null;
      renderCurrentPage();
    };

    window.openLearnPlayer = function (videoId) {
      state.learn.activeVideoId = videoId;
      lectureElapsedSeconds = 0;
      if (lectureTimerInterval) clearInterval(lectureTimerInterval);
      lectureTimerInterval = setInterval(() => {
        lectureElapsedSeconds++;
        const badge = document.getElementById('lecture-elapsed-badge');
        if (badge) badge.textContent = `Session ${formatTimer(lectureElapsedSeconds)}`;
      }, 1000);
      renderCurrentPage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.closeLearnPlayer = function () {
      state.learn.activeVideoId = null;
      if (lectureTimerInterval) clearInterval(lectureTimerInterval);
      renderCurrentPage();
    };

    window.toggleLearnFocusMode = function () {
      state.learn.focusPlayerMode = !state.learn.focusPlayerMode;
      renderCurrentPage();
    };

    window.toggleVideoFlag = function (listName, videoId) {
      const arr = state.learn[listName];
      const idx = arr.indexOf(videoId);
      if (idx >= 0) arr.splice(idx, 1);
      else {
        arr.push(videoId);
        if (listName === 'completedVideos') {
          state.profile.xp += 30;
          triggerConfetti();
          showToast('Lesson marked completed! +30 XP', 'success');
        }
      }
      saveUserStateToCloud();
      renderCurrentPage();
    };

    window.showWhyRecommended = function (videoId) {
      const v = (state.learn.liveResults || CURATED_VIDEOS).find(x => x.id === videoId) || CURATED_VIDEOS.find(x => x.id === videoId);
      if (!v) return;
      openModal(`
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <h3 class="font-display font-bold text-base text-white">AI Educational Verification</h3>
            <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>
          <div class="p-3 rounded-xl bg-emerald-500/15 border border-emerald-400/35 text-emerald-300 text-xs font-semibold">
            Classification: ${escapeHtml(v.aiCategory)}
          </div>
          <p class="text-xs text-slate-200 leading-relaxed">${escapeHtml(v.aiReason)}</p>
          <p class="text-[11px] text-slate-400 border-t border-blue-500/15 pt-2.5">
            Transparency note: NOVA's AI classification evaluates available video metadata (title, channel, subject, and description) to filter out entertainment, Shorts, and clickbait.
          </p>
        </div>
      `);
    };

    // --- Running Notes Drawer & Save to Google Drive ---
    window.toggleNotesDrawer = function (open) {
      const drawer = document.getElementById('notes-drawer');
      const overlay = document.getElementById('notes-drawer-overlay');
      if (open) {
        drawer.classList.remove('translate-x-full');
        overlay.classList.remove('hidden');
      } else {
        drawer.classList.add('translate-x-full');
        overlay.classList.add('hidden');
      }
    };

    window.insertNoteSnippet = function (textareaId, snippet) {
      const ta = document.getElementById(textareaId);
      if (!ta) return;
      const start = ta.selectionStart;
      const end = ta.selectionEnd;
      ta.value = ta.value.substring(0, start) + snippet + ta.value.substring(end);
      ta.focus();
      ta.selectionStart = ta.selectionEnd = start + snippet.length;
    };

    window.insertNoteTimestamp = function (textareaId) {
      const stamp = textareaId === 'lecture-note-body'
        ? `[${formatTimer(lectureElapsedSeconds)}] `
        : `[${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}] `;
      insertNoteSnippet(textareaId, '\n' + stamp);
    };

    window.aiSummarizeNotes = async function (textareaId) {
      const ta = document.getElementById(textareaId);
      if (!ta || !ta.value.trim()) {
        showToast('Type some running notes first before summarizing.', 'warning');
        return;
      }
      showToast('NOVA AI is structuring your lecture notes...', 'info');
      try {
        const summary = await callGeminiAPI(
          `Turn these raw student lecture running notes into clean, concise exam-revision bullet points with key formulas highlighted:\n\n${ta.value}`,
          'You are an academic note-taking assistant. Keep output clean plain text with bullet points.'
        );
        ta.value = ta.value.trim() + '\n\n--- ✨ NOVA AI REVISION SUMMARY ---\n' + summary;
        showToast('AI Revision Summary appended to your notes!', 'success');
      } catch {
        showToast('Could not reach Gemini AI right now.', 'error');
      }
    };

    window.saveRunningNote = function (source) {
      const titleEl = document.getElementById(source === 'lecture' ? 'lecture-note-title' : 'drawer-note-title');
      const subEl = document.getElementById(source === 'lecture' ? 'lecture-note-subject' : 'drawer-note-subject');
      const bodyEl = document.getElementById(source === 'lecture' ? 'lecture-note-body' : 'drawer-note-body');

      const title = (titleEl?.value || '').trim() || 'Untitled Lecture Note';
      const subject = subEl?.value || 'General';
      const content = (bodyEl?.value || '').trim();
      if (!content) {
        showToast('Write some notes before saving.', 'warning');
        return;
      }

      state.runningNotes.unshift({
        id: 'note-' + Date.now(),
        title,
        subject,
        videoId: source === 'lecture' ? state.learn.activeVideoId : null,
        updatedAt: 'Just now',
        content
      });
      saveUserStateToCloud();
      showToast(`Saved "${title}" to NOVA Notes Library!`, 'success');
      if (currentPage === 'planner') renderCurrentPage();
    };

    window.loadNoteIntoDrawer = function (noteId) {
      const n = state.runningNotes.find(x => x.id === noteId);
      if (!n) return;
      document.getElementById('drawer-note-title').value = n.title;
      document.getElementById('drawer-note-subject').value = n.subject;
      document.getElementById('drawer-note-body').value = n.content;
      toggleNotesDrawer(true);
    };

    window.deleteRunningNote = function (noteId) {
      state.runningNotes = state.runningNotes.filter(n => n.id !== noteId);
      saveUserStateToCloud();
      renderCurrentPage();
      showToast('Note deleted.', 'info');
    };

    // --- Save to Google Drive Modal & Export Helper ---
    window.openDriveExportModal = function (source, savedNoteId = null) {
      let title = 'NOVA_Lecture_Notes';
      let subject = 'General';
      let content = '';

      if (source === 'saved' && savedNoteId) {
        const n = state.runningNotes.find(x => x.id === savedNoteId);
        if (n) { title = n.title; subject = n.subject; content = n.content; }
      } else {
        const titleEl = document.getElementById(source === 'lecture' ? 'lecture-note-title' : 'drawer-note-title');
        const subEl = document.getElementById(source === 'lecture' ? 'lecture-note-subject' : 'drawer-note-subject');
        const bodyEl = document.getElementById(source === 'lecture' ? 'lecture-note-body' : 'drawer-note-body');
        title = (titleEl?.value || '').trim() || 'NOVA Lecture Notes';
        subject = subEl?.value || 'General';
        content = (bodyEl?.value || '').trim();
      }

      if (!content) {
        showToast('Your note is empty — add some notes first!', 'warning');
        return;
      }

      window._pendingDriveExport = { title, subject, content };

      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <i data-lucide="hard-drive-upload" class="w-5 h-5 text-emerald-400"></i>
              <h3 class="font-display font-bold text-lg text-white">Save Notes to Google Drive</h3>
            </div>
            <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
          </div>
          <div class="p-3 rounded-xl bg-slate-900/75 border border-blue-500/20">
            <p class="text-xs font-bold text-white truncate">${escapeHtml(title)}</p>
            <p class="text-[11px] text-sky-300 mt-0.5">${escapeHtml(subject)} • ${content.length} characters</p>
          </div>
          <div class="space-y-2.5">
            <button onclick="exportNoteAndOpenDrive('doc')" class="w-full py-3 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold flex items-center justify-between transition shadow-lg">
              <span class="flex items-center gap-2"><i data-lucide="file-text" class="w-4 h-4"></i> Download Google Docs (.doc) &amp; Open Drive</span>
              <i data-lucide="external-link" class="w-4 h-4"></i>
            </button>
            <div class="grid grid-cols-2 gap-2.5">
              <button onclick="downloadNoteFile('md')" class="py-2.5 px-3 rounded-xl bg-blue-500/15 hover:bg-blue-500/30 border border-blue-400/30 text-sky-200 text-xs font-semibold">Download Markdown (.md)</button>
              <button onclick="downloadNoteFile('txt')" class="py-2.5 px-3 rounded-xl bg-blue-500/15 hover:bg-blue-500/30 border border-blue-400/30 text-sky-200 text-xs font-semibold">Download Plain Text (.txt)</button>
            </div>
          </div>
          <p class="text-[11px] text-slate-400 leading-relaxed">
            Clicking "Download Google Docs (.doc) &amp; Open Drive" exports your formatted lecture notes as a Google Docs-ready file and opens your Google Drive folder so you can drop it straight in.
          </p>
        </div>
      `);
    };

    window.downloadNoteFile = function (format) {
      const note = window._pendingDriveExport;
      if (!note) return;
      const safeName = note.title.replace(/[^a-z0-9]+/gi, '_').slice(0, 48);
      let blob, ext;

      if (format === 'doc') {
        const htmlDoc = `<html><head><meta charset="utf-8"><title>${escapeHtml(note.title)}</title></head><body style="font-family:Arial,sans-serif;line-height:1.6;"><h1>${escapeHtml(note.title)}</h1><p><strong>Subject:</strong> ${escapeHtml(note.subject)} | <strong>Exported from NOVA</strong></p><hr/><pre style="font-family:Arial,sans-serif;white-space:pre-wrap;">${escapeHtml(note.content)}</pre></body></html>`;
        blob = new Blob([htmlDoc], { type: 'application/msword' });
        ext = 'doc';
      } else if (format === 'md') {
        const md = `# ${note.title}\n**Subject:** ${note.subject}  \n*Exported from NOVA — Your Focus. Your Future.*\n\n---\n\n${note.content}\n`;
        blob = new Blob([md], { type: 'text/markdown' });
        ext = 'md';
      } else {
        const txt = `${note.title}\nSubject: ${note.subject}\n----------------------------------------\n\n${note.content}\n`;
        blob = new Blob([txt], { type: 'text/plain' });
        ext = 'txt';
      }

      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${safeName}.${ext}`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast(`Downloaded ${safeName}.${ext}!`, 'success');
    };

    window.exportNoteAndOpenDrive = function (format) {
      downloadNoteFile(format);
      window.open('https://drive.google.com/drive/my-drive', '_blank', 'noopener,noreferrer');
      closeModal();
      showToast('File downloaded & Google Drive opened in a new tab!', 'success');
    };

    // --- Settings Actions ---
    window.saveSettingsForm = function (e) {
      e.preventDefault();
      state.profile.name = document.getElementById('set-name').value.trim() || 'Alex';
      state.profile.fullName = document.getElementById('set-fullname').value.trim() || state.profile.name;
      state.profile.major = document.getElementById('set-major').value.trim();
      state.profile.dailyGoalMins = Number(document.getElementById('set-goal').value) || 180;
      state.profile.youtubeApiKey = document.getElementById('set-yt-key').value.trim();
      saveUserStateToCloud();
      renderAll();
      showToast('Settings saved successfully!', 'success');
    };

    window.resetDemoData = function () {
      state = createInitialState();
      saveUserStateToCloud();
      renderAll();
      showToast('Demo data has been reset to defaults.', 'info');
    };

    // =========================================================================
    // 17. BOOTSTRAP APPLICATION
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      renderAll();
      initAuth();
    });
  </script>
